<div class="modal-overlay">
  <div class="modal edit-modal">
    <h2>Edit Task</h2>

    <label for="edit-task-title">Title <span class="required">*</span></label>
    <input
      id="edit-task-title"
      type="text"
      name="title"
      maxlength="120"
      [ngModel]="title()"
      (ngModelChange)="title.set($event)"
    />

    <div class="form-group">
      <label for="edit-task-category">Category <span class="required">*</span></label>
      <div class="select-wrapper">
        <select
          id="edit-task-category"
          name="category"
          required
          [ngModel]="category()"
          (ngModelChange)="category.set($event)"
        >
          <option value="">Select Category</option>
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </div>
    </div>

    <label for="edit-task-description">Description</label>
    <textarea
      id="edit-task-description"
      name="description"
      maxlength="2000"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
    ></textarea>

    <label for="edit-task-location">Location <span class="required">*</span></label>
    <input
      id="edit-task-location"
      type="text"
      name="location"
      maxlength="150"
      [ngModel]="location()"
      (ngModelChange)="location.set($event)"
    />

    <label for="edit-task-start">Start Date &amp; Time <span class="required">*</span></label>
    <input
      id="edit-task-start"
      type="datetime-local"
      name="start_time"
      [ngModel]="startDate()"
      (ngModelChange)="startDate.set($event)"
    />

    <label for="edit-task-end">End Date &amp; Time <span class="required">*</span></label>
    <input
      id="edit-task-end"
      type="datetime-local"
      name="end_time"
      [ngModel]="endDate()"
      (ngModelChange)="endDate.set($event)"
    />

    <label for="edit-task-image">Change Image</label>
    <input id="edit-task-image" type="file" accept="image/*" (change)="onImageChange($event)" />

    <div class="modal-actions">
      <button (click)="handleSubmit()" [disabled]="saving()">
        {{ saving() ? 'Updating...' : 'Update' }}
      </button>
      <button (click)="closed.emit()">Cancel</button>
    </div>
  </div>
</div>
