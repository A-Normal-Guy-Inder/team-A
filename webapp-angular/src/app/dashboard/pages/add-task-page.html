<div class="add-task-container">
  <div class="add-task-form">
    <h2>Add Task</h2>

    <div class="form-group">
      <label for="add-task-title">Task Title <span class="required">*</span></label>
      <input
        id="add-task-title"
        type="text"
        name="title"
        placeholder="Task Title"
        maxlength="120"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
      />
    </div>

    <div class="form-group">
      <label for="add-task-description">Task Description</label>
      <textarea
        id="add-task-description"
        name="description"
        placeholder="Describe the task you need help with"
        maxlength="2000"
        rows="4"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
      ></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="add-task-category">Category <span class="required">*</span></label>
        <div class="select-wrapper">
          <select
            id="add-task-category"
            name="category"
            required
            [ngModel]="category()"
            (ngModelChange)="category.set($event)"
          >
            <option value="">Select Category</option>
            @for (cat of categories; track cat) {
              <option [value]="cat">{{ cat }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="add-task-location">Location <span class="required">*</span></label>
        <input
          id="add-task-location"
          type="text"
          name="location"
          placeholder="City, State"
          maxlength="150"
          [ngModel]="location()"
          (ngModelChange)="location.set($event)"
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="add-task-start"> Start Date <span class="required">*</span></label>
        <input
          id="add-task-start"
          type="datetime-local"
          name="start_time"
          [min]="minStartDate()"
          [ngModel]="startDate()"
          (ngModelChange)="startDate.set($event)"
        />
      </div>
      <div class="form-group">
        <label for="add-task-end"> End Date <span class="required">*</span></label>
        <input
          id="add-task-end"
          type="datetime-local"
          name="end_time"
          [min]="minEndDate()"
          [ngModel]="endDate()"
          (ngModelChange)="endDate.set($event)"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="task-image">Task Image</label>
      <app-image-upload-field
        inputId="task-image"
        [preview]="imagePreview()"
        (select)="onImageSelect($event)"
        (remove)="onImageRemove()"
      />
    </div>

    <div class="form-actions">
      <button class="btn-submit" (click)="handleSubmit()" [disabled]="saving()">
        {{ saving() ? 'Adding...' : 'Add Task' }}
      </button>
      <button class="btn-cancel" type="button" (click)="handleCancel()" [disabled]="saving()">
        Cancel
      </button>
    </div>
  </div>
</div>
