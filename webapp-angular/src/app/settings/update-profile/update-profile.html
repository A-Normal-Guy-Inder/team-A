<div class="settings-card">
  <h3>Profile Picture</h3>
  <div class="profile-picture-section">
    <div class="profile-preview">
      @if (preview()) {
        <img [src]="preview()" alt="profile" />
      } @else {
        <div class="profile-placeholder">{{ firstName().charAt(0) || 'U' }}</div>
      }
    </div>
    <div class="profile-picture-controls">
      <input
        type="file"
        accept="image/*"
        [disabled]="pictureBusy()"
        (change)="onImageChange($event)"
      />
      @if (uploading()) {
        <span class="settings-hint">Uploading…</span>
      }
      @if (canRemovePicture()) {
        <button
          class="settings-cancel-btn"
          (click)="handleRemovePicture()"
          [disabled]="pictureBusy()"
        >
          {{ removing() ? 'Removing…' : 'Remove photo' }}
        </button>
      }
    </div>
  </div>
</div>

<div class="settings-card">
  <h3>Personal Information</h3>
  <div class="settings-row">
    <input
      name="first_name"
      placeholder="First Name"
      maxlength="50"
      [ngModel]="firstName()"
      (ngModelChange)="firstName.set($event)"
    />
    <input
      name="last_name"
      placeholder="Last Name"
      maxlength="50"
      [ngModel]="lastName()"
      (ngModelChange)="lastName.set($event)"
    />
  </div>
  <input name="email" placeholder="Email" [value]="email()" disabled />
  <input
    name="phone_number"
    placeholder="Phone Number"
    maxlength="10"
    [ngModel]="phoneNumber()"
    (ngModelChange)="phoneNumber.set($event)"
  />

  <label class="settings-hint" for="profile-bio">
    Bio <span class="bio-counter">{{ bio().length }}/{{ BIO_MAX }}</span>
  </label>
  <textarea
    id="profile-bio"
    name="bio"
    class="settings-textarea"
    rows="4"
    placeholder="Tell others a little about yourself"
    [maxlength]="BIO_MAX"
    [ngModel]="bio()"
    (ngModelChange)="bio.set($event)"
  ></textarea>

  <button class="settings-save-btn" (click)="handleSave()" [disabled]="saving()">
    {{ saving() ? 'Saving...' : 'Save Changes' }}
  </button>
</div>
