<div class="settings-container">
  <div class="settings-card">
    <h3>Change Password</h3>

    @if (step() === 1) {
      <app-password-input
        name="current_password"
        placeholder="Enter Current Password"
        autocomplete="current-password"
        [value]="currentPassword()"
        (valueChange)="currentPassword.set($event)"
        (enter)="handleVerifyPassword()"
      />
      <div class="credentials-actions">
        <button class="settings-save-btn" (click)="handleVerifyPassword()" [disabled]="loading()">
          {{ loading() ? 'Verifying...' : 'Verify Password' }}
        </button>
        <button class="settings-cancel-btn" (click)="handleCancel()" [disabled]="loading()">
          Cancel
        </button>
      </div>
    }

    @if (step() === 2) {
      <app-password-input
        name="new_password"
        placeholder="New Password"
        autocomplete="new-password"
        [value]="newPassword()"
        (valueChange)="newPassword.set($event)"
      />
      <app-password-input
        name="confirm_password"
        placeholder="Confirm Password"
        autocomplete="new-password"
        [value]="confirmPassword()"
        (valueChange)="confirmPassword.set($event)"
        (enter)="handleChangePassword()"
      />
      <div class="credentials-actions">
        <button class="settings-save-btn" (click)="handleChangePassword()" [disabled]="loading()">
          {{ loading() ? 'Updating...' : 'Change Password' }}
        </button>
        <button class="settings-cancel-btn" (click)="handleCancel()" [disabled]="loading()">
          Cancel
        </button>
      </div>
    }
  </div>
</div>
