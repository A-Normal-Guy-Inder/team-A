@if (loading()) {
  <app-loader />
}

<div class="auth-container">
  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p>Enter your registered email to receive OTP</p>

    <label for="forgot-email" class="auth-label">
      Email Address <span class="required">*</span>
    </label>
    <input
      id="forgot-email"
      class="auth-input"
      type="email"
      name="email"
      autocomplete="email"
      placeholder="Enter email"
      maxlength="100"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      (keydown)="onKeydown($event)"
    />

    <button class="primary-btn" (click)="handleSendOtp()" [disabled]="loading()">
      {{ loading() ? 'Sending...' : 'Send OTP' }}
    </button>
  </div>
</div>
