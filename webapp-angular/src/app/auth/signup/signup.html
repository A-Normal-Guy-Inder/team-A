@if (loading()) {
  <app-loader />
}

<div class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p>Join the HelperHub community</p>

    <div class="two-col">
      <div class="input-group">
        <label for="signup-first-name" class="auth-label">
          First Name <span class="required">*</span>
        </label>
        <input
          id="signup-first-name"
          class="auth-input"
          name="first_name"
          type="text"
          maxlength="50"
          autocomplete="given-name"
          placeholder="First Name"
          [ngModel]="firstName()"
          (ngModelChange)="firstName.set($event)"
        />
      </div>
      <div class="input-group">
        <label for="signup-last-name" class="auth-label">
          Last Name <span class="required">*</span>
        </label>
        <input
          id="signup-last-name"
          class="auth-input"
          name="last_name"
          type="text"
          maxlength="50"
          autocomplete="family-name"
          placeholder="Last Name"
          [ngModel]="lastName()"
          (ngModelChange)="lastName.set($event)"
        />
      </div>
    </div>

    <div class="input-group">
      <label for="signup-phone" class="auth-label">
        Phone Number <span class="required">*</span>
      </label>
      <input
        id="signup-phone"
        class="auth-input"
        name="phone_number"
        maxlength="10"
        autocomplete="tel"
        placeholder="Phone Number"
        [ngModel]="phoneNumber()"
        (ngModelChange)="phoneNumber.set($event)"
      />
    </div>

    <div class="input-group">
      <label for="signup-email" class="auth-label">
        Email Address <span class="required">*</span>
      </label>
      <input
        id="signup-email"
        class="auth-input"
        name="email_id"
        type="email"
        maxlength="100"
        autocomplete="email"
        placeholder="Enter your email"
        [ngModel]="emailId()"
        (ngModelChange)="emailId.set($event)"
      />
    </div>

    <div class="input-group">
      <label for="signup-password" class="auth-label">
        Password <span class="required">*</span>
      </label>
      <div class="password-field">
        <input
          id="signup-password"
          class="auth-input"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          maxlength="100"
          autocomplete="new-password"
          placeholder="Create your password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
        <button
          type="button"
          class="toggle-password"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          (click)="showPassword.set(!showPassword())"
        >
          @if (showPassword()) {
            <app-icon-eye-off [size]="18" />
          } @else {
            <app-icon-eye [size]="18" />
          }
        </button>
      </div>
    </div>

    <button class="primary-btn" (click)="handleSignup()" [disabled]="loading()">
      {{ loading() ? 'Creating account...' : 'Create Account' }}
    </button>

    <div class="auth-footer">Already have an account? <a routerLink="/login">Sign In</a></div>
  </div>
</div>
