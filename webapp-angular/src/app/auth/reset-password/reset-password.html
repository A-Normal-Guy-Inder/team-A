@if (email()) {
  @if (loading()) {
    <app-loader />
  }

  <div class="auth-container">
    <div class="auth-card">
      <h2>Reset Password</h2>
      <p>Create a new password</p>

      <label for="reset-password" class="auth-label">
        New Password <span class="required">*</span>
      </label>
      <div class="password-field">
        <input
          id="reset-password"
          class="auth-input"
          name="new_password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="New password"
          maxlength="100"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
        <button
          type="button"
          class="toggle-password"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          (click)="showPassword.set(!showPassword())"
        >
          @if (showPassword()) {
            <app-icon-eye-off [size]="18" />
          } @else {
            <app-icon-eye [size]="18" />
          }
        </button>
      </div>

      <label for="reset-confirm-password" class="auth-label">
        Confirm Password <span class="required">*</span>
      </label>
      <div class="password-field">
        <input
          id="reset-confirm-password"
          class="auth-input"
          name="confirm_password"
          [type]="showConfirmPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Confirm password"
          maxlength="100"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          (keydown)="onConfirmKeydown($event)"
        />
        <button
          type="button"
          class="toggle-password"
          [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'"
          (click)="showConfirmPassword.set(!showConfirmPassword())"
        >
          @if (showConfirmPassword()) {
            <app-icon-eye-off [size]="18" />
          } @else {
            <app-icon-eye [size]="18" />
          }
        </button>
      </div>

      <button class="primary-btn" (click)="handleReset()" [disabled]="loading()">
        {{ loading() ? 'Updating...' : 'Update Password' }}
      </button>
    </div>
  </div>
}
