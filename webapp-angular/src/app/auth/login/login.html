@if (loading()) {
  <app-loader />
}

<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p>Sign in to your HelperHub account</p>

    <label for="login-email" class="auth-label">
      Email Address <span class="required">*</span>
    </label>
    <input
      id="login-email"
      class="auth-input"
      type="email"
      name="email"
      autocomplete="email"
      maxlength="100"
      placeholder="Enter your email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      (keydown)="handleKeyDown($event)"
    />

    <label for="login-password" class="auth-label">
      Password <span class="required">*</span>
    </label>
    <div class="password-field">
      <input
        id="login-password"
        class="auth-input"
        name="password"
        [type]="showPassword() ? 'text' : 'password'"
        autocomplete="current-password"
        maxlength="100"
        placeholder="Enter your password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        (keydown)="handleKeyDown($event)"
      />
      <button
        type="button"
        class="toggle-password"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        (click)="showPassword.set(!showPassword())"
      >
        @if (showPassword()) {
          <app-icon-eye-off [size]="18" />
        } @else {
          <app-icon-eye [size]="18" />
        }
      </button>
    </div>

    <div class="auth-options">
      <label class="remember-me">
        <input
          type="checkbox"
          name="remember"
          [ngModel]="remember()"
          (ngModelChange)="remember.set($event)"
        />
        Remember me
      </label>

      <a routerLink="/ForgotPassword" class="forgot-link">Forgot password?</a>
    </div>

    <button (click)="handleLogin()" [disabled]="loading()" class="primary-btn">
      {{ loading() ? 'Signing in...' : 'Sign In' }}
    </button>

    <div class="auth-footer">Don’t have an account? <a routerLink="/signup">Sign Up</a></div>
  </div>
</div>
